[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openvox"
version = "0.1.0"
description = "All-in-one, fully offline voice engine (speech-to-text and text-to-speech)."
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "platformdirs>=4.0"]

[project.optional-dependencies]
stt      = ["faster-whisper>=1.0.0", "pysilero-vad>=2.0.0", "sounddevice>=0.4.6", "huggingface_hub>=0.23"]
stt-demo = ["av>=11"]
tts      = ["kokoro-onnx>=0.5.0", "sounddevice>=0.4.6"]
dev      = ["pytest>=8.0"]
all      = ["openvox[stt,stt-demo,tts]"]

[project.scripts]
openvox-stt-demo = "openvox.stt.demo:main"
openvox-tts-demo = "openvox.tts.demo:main"

[tool.setuptools.packages.find]
include = ["openvox*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs model download / real audio backend"]
